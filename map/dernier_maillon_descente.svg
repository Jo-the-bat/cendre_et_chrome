<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1840" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ddd3c0" stroke-width="1"/>
    </pattern>
    <pattern id="water" width="22" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="22" height="14" fill="#7fb2cd"/>
      <path d="M0 7 q5.5 -5 11 0 t11 0" fill="none" stroke="#a9d2e6" stroke-width="1.4"/>
    </pattern>
    <pattern id="rubble" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#9a8f7a"/>
      <path d="M0 0H16M0 8H16" stroke="#7c7160" stroke-width="1.4"/>
    </pattern>
    <pattern id="rust" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#b5651d"/>
      <circle cx="3" cy="4" r="1.4" fill="#8a4a12"/>
      <circle cx="10" cy="9" r="1.2" fill="#d98a3a"/>
      <circle cx="7" cy="2" r="1" fill="#d98a3a"/>
    </pattern>
    <style>
      .title{font-size:30px;font-weight:700;fill:#241f17}
      .rm{font-size:21px;font-weight:700;fill:#241f17;paint-order:stroke;stroke:#f4efe3;stroke-width:3}
      .sub{font-size:13.5px;fill:#4a4234;paint-order:stroke;stroke:#f4efe3;stroke-width:2.5}
      .lbl{font-size:12.5px;fill:#241f17;paint-order:stroke;stroke:#f4efe3;stroke-width:2.5}
      .gl{font-size:12.5px;font-weight:700;fill:#a11515;paint-order:stroke;stroke:#fff;stroke-width:2.5}
      .leg{font-size:14px;fill:#241f17}
      .wall{fill:#efe7d6;stroke:#2b2620;stroke-width:6}
    </style>
  </defs>

  <!-- background + grid -->
  <rect width="1200" height="1840" fill="#f4efe3"/>
  <rect width="1200" height="1840" fill="url(#grid)"/>

  <!-- title + scale -->
  <text x="40" y="46" class="title">LE DERNIER MAILLON — plan de la descente (vue du dessus)</text>
  <g transform="translate(40,64)">
    <line x1="0" y1="10" x2="120" y2="10" stroke="#241f17" stroke-width="3"/>
    <line x1="0" y1="4" x2="0" y2="16" stroke="#241f17" stroke-width="3"/>
    <line x1="40" y1="4" x2="40" y2="16" stroke="#241f17" stroke-width="2"/>
    <line x1="80" y1="4" x2="80" y2="16" stroke="#241f17" stroke-width="2"/>
    <line x1="120" y1="4" x2="120" y2="16" stroke="#241f17" stroke-width="3"/>
    <text x="132" y="15" class="leg">échelle : 1 carreau ≈ 1,5 m  (descente du haut vers le bas)</text>
  </g>

  <!-- ===== PUITS (entrée) ===== -->
  <g>
    <rect x="548" y="104" width="104" height="74" rx="6" class="wall"/>
    <line x1="548" y1="122" x2="652" y2="122" stroke="#7c7160" stroke-width="3"/>
    <line x1="548" y1="141" x2="652" y2="141" stroke="#7c7160" stroke-width="3"/>
    <line x1="548" y1="160" x2="652" y2="160" stroke="#7c7160" stroke-width="3"/>
    <text x="666" y="132" class="rm">PUITS — entrée</text>
    <text x="666" y="152" class="sub">sous l'étal d'Ori (surface) · échelle de barreaux</text>
    <!-- shaft to collector -->
    <rect x="572" y="178" width="56" height="34" fill="#efe7d6" stroke="#2b2620" stroke-width="6"/>
  </g>

  <!-- ===== 1 — COLLECTEUR NOYÉ ===== -->
  <g>
    <rect x="150" y="210" width="900" height="156" rx="40" class="wall"/>
    <!-- water (lower part) -->
    <path d="M158 300 H1042 V326 a32 32 0 0 1 -32 32 H190 a32 32 0 0 1 -32 -32 Z" fill="url(#water)" opacity="0.92"/>
    <text x="176" y="246" class="rm">① COLLECTEUR NOYÉ</text>
    <text x="176" y="266" class="sub">tunnel voûté à demi noyé — eau noire, la Rouille y nage</text>
    <text x="176" y="346" class="lbl">⚠ Lolita hors de l'eau (corrosion)</text>
    <!-- grille de trop-plein (bypass) -->
    <rect x="1004" y="250" width="64" height="40" fill="#efe7d6" stroke="#2b2620" stroke-width="4" stroke-dasharray="6 5"/>
    <text x="1006" y="240" class="lbl">grille de</text>
    <text x="1006" y="304" class="lbl">trop-plein (contournement · Namie)</text>
    <!-- GOULOT 1 exit -->
    <rect x="566" y="358" width="68" height="34" fill="#efe7d6" stroke="#a11515" stroke-width="5"/>
    <text x="640" y="382" class="gl">⛓ GOULOT ① — la Nuée colmate</text>
  </g>

  <!-- ===== EMBRANCHEMENT (puzzle) ===== -->
  <g>
    <!-- hub -->
    <path d="M520 410 H680 L700 470 L640 540 L560 540 L500 470 Z" class="wall"/>
    <text x="600" y="452" text-anchor="middle" class="rm">EMBRANCHEMENT</text>
    <text x="600" y="472" text-anchor="middle" class="sub">le puzzle — « suis le chœur, pas le fantôme »</text>

    <!-- route FANTÔME (gauche, piège) -->
    <line x1="500" y1="470" x2="360" y2="470" stroke="#2b2620" stroke-width="6"/>
    <rect x="150" y="420" width="210" height="120" rx="10" fill="url(#rust)" opacity="0.9" stroke="#2b2620" stroke-width="6"/>
    <text x="255" y="468" text-anchor="middle" class="lbl" style="stroke-width:0;fill:#3a1d06;font-weight:700">FANTÔME ☠</text>
    <text x="255" y="488" text-anchor="middle" class="lbl" style="stroke-width:0;fill:#3a1d06">piège : beacon mort</text>
    <text x="255" y="506" text-anchor="middle" class="lbl" style="stroke-width:0;fill:#3a1d06">+ nid de Rouille</text>

    <!-- route TRAPPE (droite, raccourci) -->
    <line x1="700" y1="455" x2="900" y2="455" stroke="#2b2620" stroke-width="4" stroke-dasharray="9 6"/>
    <rect x="900" y="430" width="120" height="56" rx="6" fill="#efe7d6" stroke="#2b2620" stroke-width="4" stroke-dasharray="6 5"/>
    <text x="960" y="455" text-anchor="middle" class="lbl">TRAPPE</text>
    <text x="960" y="473" text-anchor="middle" class="lbl">raccourci · Namie</text>
    <path d="M960 486 V612" stroke="#2b2620" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="968" y="560" class="lbl">(court-circuite</text>
    <text x="968" y="578" class="lbl">l'embranchement)</text>

    <!-- route CONDUIT NOYÉ (vraie voie, eau) -->
    <rect x="556" y="540" width="56" height="56" fill="url(#water)" stroke="#2b2620" stroke-width="6"/>
    <text x="470" y="566" class="lbl" style="fill:#0d3a52">conduit noyé →</text>
    <text x="430" y="584" class="lbl" style="fill:#0d3a52">VRAIE voie (immergée ;</text>
    <text x="430" y="602" class="lbl" style="fill:#0d3a52">Michel draine = au sec)</text>

    <!-- route PASSERELLE (gap) -->
    <line x1="664" y1="540" x2="700" y2="582" stroke="#2b2620" stroke-width="6"/>
    <line x1="718" y1="540" x2="752" y2="582" stroke="#2b2620" stroke-width="6"/>
    <text x="710" y="534" text-anchor="middle" class="gl" style="fill:#7a5a12">↯ passerelle</text>
    <text x="724" y="600" class="lbl">saut / grappin (le vide)</text>
  </g>

  <!-- ===== 2 — GALERIE EFFONDRÉE ===== -->
  <g>
    <rect x="180" y="612" width="840" height="214" rx="8" class="wall"/>
    <text x="206" y="648" class="rm">② GALERIE EFFONDRÉE</text>
    <text x="206" y="668" class="sub">chaîne d'assemblage écroulée — la Foreuse creuse, le terrain change</text>
    <!-- collapsed beams -->
    <g stroke="#5b5240" stroke-width="9" stroke-linecap="round">
      <line x1="240" y1="700" x2="430" y2="800"/>
      <line x1="470" y1="690" x2="610" y2="812"/>
      <line x1="650" y1="800" x2="820" y2="700"/>
    </g>
    <!-- conveyor -->
    <rect x="300" y="752" width="430" height="22" rx="11" fill="#cdbf9f" stroke="#5b5240" stroke-width="2"/>
    <text x="312" y="747" class="lbl">convoyeur figé</text>
    <!-- rubble piles -->
    <path d="M860 720 q30 -28 60 0 q26 24 0 40 q-34 22 -60 0 q-22 -22 0 -40 Z" fill="url(#rubble)" stroke="#2b2620" stroke-width="3"/>
    <text x="838" y="786" class="lbl">gravats</text>
    <!-- Foreuse burrow -->
    <circle cx="965" cy="700" r="20" fill="#2b2620" opacity="0.85"/>
    <path d="M945 700 q-26 18 -10 70" fill="none" stroke="#2b2620" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="906" y="690" class="lbl" style="font-weight:700">FOREUSE</text>
    <text x="900" y="788" class="lbl">(creuse / rouvre)</text>
    <!-- GOULOT 2 exit -->
    <rect x="566" y="818" width="68" height="34" fill="#efe7d6" stroke="#a11515" stroke-width="5"/>
    <text x="640" y="842" class="gl">⛓ GOULOT ②</text>
  </g>

  <!-- ===== 3 — SALLE DES DORMANTS ===== -->
  <g>
    <rect x="160" y="864" width="880" height="296" rx="8" class="wall"/>
    <text x="186" y="900" class="rm">③ SALLE DES DORMANTS</text>
    <text x="186" y="920" class="sub">berceaux de chargement — la Rouille les dévore (timer)</text>

    <!-- Rouille creeping from left wall -->
    <rect x="160" y="864" width="120" height="296" fill="url(#rust)" opacity="0.5"/>
    <text x="172" y="1080" class="lbl" style="fill:#3a1d06;stroke-width:0">la Rouille</text>
    <text x="172" y="1098" class="lbl" style="fill:#3a1d06;stroke-width:0">gagne →</text>

    <!-- generic cradles (top + bottom rows) -->
    <g fill="#d9cdb0" stroke="#5b5240" stroke-width="2">
      <rect x="320" y="946" width="40" height="26"/><rect x="372" y="946" width="40" height="26"/>
      <rect x="424" y="946" width="40" height="26"/><rect x="476" y="946" width="40" height="26"/>
      <rect x="700" y="946" width="40" height="26"/><rect x="752" y="946" width="40" height="26"/>
      <rect x="804" y="946" width="40" height="26"/><rect x="856" y="946" width="40" height="26"/><rect x="908" y="946" width="40" height="26"/>
      <rect x="320" y="1064" width="40" height="26"/><rect x="372" y="1064" width="40" height="26"/>
      <rect x="476" y="1064" width="40" height="26"/><rect x="528" y="1064" width="40" height="26"/>
      <rect x="804" y="1064" width="40" height="26"/><rect x="856" y="1064" width="40" height="26"/><rect x="908" y="1064" width="40" height="26"/>
    </g>
    <!-- the three "complexes" highlighted -->
    <g stroke="#1f6f3a" stroke-width="3">
      <rect x="556" y="946" width="44" height="28" fill="#bfe3c8"/>
      <rect x="620" y="946" width="44" height="28" fill="#bfe3c8"/>
      <rect x="588" y="1064" width="44" height="28" fill="#bfe3c8"/>
    </g>
    <text x="578" y="938" text-anchor="middle" class="lbl" style="fill:#13502a">INIT</text>
    <text x="642" y="938" text-anchor="middle" class="lbl" style="fill:#13502a">ECHO</text>
    <text x="610" y="1110" text-anchor="middle" class="lbl" style="fill:#13502a">[sans nom]</text>
    <text x="606" y="1010" text-anchor="middle" class="lbl">↑ les 3 dormants « complexes »</text>

    <!-- blast door to chamber -->
    <rect x="560" y="1152" width="80" height="32" fill="#cdbf9f" stroke="#2b2620" stroke-width="6"/>
    <text x="650" y="1175" class="gl" style="fill:#7a5a12">▣ PORTE BLINDÉE — Larcin/Méca Difficile</text>
  </g>

  <!-- ===== 4 — CHAMBRE BAKTOID ===== -->
  <g>
    <rect x="140" y="1190" width="920" height="430" rx="8" class="wall"/>
    <text x="166" y="1228" class="rm">④ CHAMBRE BAKTOID — le trésor de Michel + la Mère</text>
    <text x="166" y="1248" class="sub">aile de fabrication scellée · extraction sous pression (la Mère engendre la Nuée)</text>

    <!-- assembly line (top) -->
    <rect x="200" y="1276" width="560" height="40" rx="6" fill="#cdbf9f" stroke="#5b5240" stroke-width="2"/>
    <g stroke="#5b5240" stroke-width="6" stroke-linecap="round">
      <line x1="250" y1="1276" x2="250" y2="1244"/><line x1="350" y1="1276" x2="350" y2="1244"/>
      <line x1="450" y1="1276" x2="450" y2="1244"/><line x1="550" y1="1276" x2="550" y2="1244"/>
      <line x1="650" y1="1276" x2="650" y2="1244"/>
    </g>
    <text x="214" y="1303" class="lbl">chaîne d'assemblage Baktoid (bras articulés)</text>

    <!-- component bins (right) -->
    <g fill="#d9cdb0" stroke="#5b5240" stroke-width="2">
      <rect x="940" y="1300" width="46" height="34"/><rect x="992" y="1300" width="46" height="34"/>
      <rect x="940" y="1342" width="46" height="34"/><rect x="992" y="1342" width="46" height="34"/>
    </g>
    <text x="912" y="1296" class="lbl">bacs de composants</text>

    <!-- schema consoles -->
    <rect x="200" y="1500" width="120" height="40" rx="4" fill="#c7d8df" stroke="#2b2620" stroke-width="3"/>
    <text x="206" y="1494" class="lbl">consoles de schémas</text>

    <!-- data-core vault -->
    <rect x="372" y="1494" width="120" height="64" rx="4" fill="#efe7d6" stroke="#1f6f3a" stroke-width="4"/>
    <rect x="382" y="1504" width="100" height="44" rx="3" fill="none" stroke="#1f6f3a" stroke-width="2"/>
    <text x="432" y="1522" text-anchor="middle" class="lbl" style="fill:#13502a;font-weight:700">COFFRE</text>
    <text x="432" y="1540" text-anchor="middle" class="lbl" style="fill:#13502a">data-cœur</text>
    <text x="372" y="1582" class="lbl" style="fill:#13502a">plans Baktoid · Michel + Namie</text>

    <!-- la Mère (center) -->
    <g transform="translate(640,1430)">
      <path d="M0 -86 C58 -78 96 -40 86 6 C108 28 96 76 50 84 C30 110 -34 108 -54 80 C-104 74 -110 22 -86 -2 C-100 -46 -56 -82 0 -86 Z"
            fill="url(#rust)" stroke="#3a1d06" stroke-width="5"/>
      <path d="M0 -86 C58 -78 96 -40 86 6 C108 28 96 76 50 84 C30 110 -34 108 -54 80 C-104 74 -110 22 -86 -2 C-100 -46 -56 -82 0 -86 Z"
            fill="#1f6f3a" opacity="0.18"/>
      <!-- roots into the fabricator -->
      <g stroke="#3a1d06" stroke-width="4" fill="none" opacity="0.8">
        <path d="M-60 -60 q-40 -30 -90 -30"/><path d="M70 -50 q40 -26 96 -18"/>
        <path d="M-70 70 q-40 30 -96 26"/><path d="M64 76 q44 26 96 40"/>
      </g>
      <text x="0" y="0" text-anchor="middle" class="rm" style="fill:#fff;stroke:#3a1d06;stroke-width:3.5">LA MÈRE</text>
      <text x="0" y="22" text-anchor="middle" class="lbl" style="fill:#fff;stroke:#3a1d06;stroke-width:2.5">boss · enracinée</text>
    </g>

    <!-- back exit / collapse -->
    <rect x="146" y="1372" width="34" height="80" fill="#efe7d6" stroke="#a11515" stroke-width="5"/>
    <text x="160" y="1360" class="gl">← sortie</text>
    <text x="150" y="1466" class="gl" style="fill:#a11515">effondrement</text>
    <text x="150" y="1483" class="gl" style="fill:#a11515">(3 rounds)</text>
  </g>

  <!-- connectors between levels -->
  <g stroke="#2b2620" stroke-width="6" fill="none">
    <path d="M600 392 V410"/>
    <path d="M584 596 V612"/>
    <path d="M600 852 V864"/>
    <path d="M600 1184 V1190"/>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(140,1660)">
    <rect x="0" y="0" width="920" height="150" rx="8" fill="#efe7d6" stroke="#2b2620" stroke-width="3"/>
    <text x="16" y="28" class="rm" style="font-size:18px">LÉGENDE</text>
    <g transform="translate(16,44)">
      <rect x="0" y="0" width="34" height="22" fill="url(#water)" stroke="#2b2620" stroke-width="1.5"/>
      <text x="44" y="16" class="leg">eau (Lolita ne patauge pas)</text>
      <rect x="300" y="0" width="34" height="22" fill="url(#rubble)" stroke="#2b2620" stroke-width="1.5"/>
      <text x="344" y="16" class="leg">gravats / effondrement</text>
      <rect x="600" y="0" width="34" height="22" fill="url(#rust)" stroke="#2b2620" stroke-width="1.5"/>
      <text x="644" y="16" class="leg">nid / avancée de la Rouille</text>
    </g>
    <g transform="translate(16,82)">
      <rect x="0" y="0" width="34" height="22" fill="#efe7d6" stroke="#a11515" stroke-width="4"/>
      <text x="44" y="16" class="leg">⛓ goulot d'étranglement</text>
      <rect x="300" y="0" width="34" height="22" fill="#bfe3c8" stroke="#1f6f3a" stroke-width="3"/>
      <text x="344" y="16" class="leg">berceau (dormant ; vert = « complexe »)</text>
      <rect x="600" y="0" width="34" height="22" fill="#efe7d6" stroke="#1f6f3a" stroke-width="3"/>
      <text x="644" y="16" class="leg">coffre / objectif d'extraction</text>
    </g>
    <text x="16" y="138" class="leg" style="font-style:italic">Descente linéaire haut→bas. L'embranchement est le seul vrai choix de chemin : draine le conduit noyé OU saute la passerelle ; évite le fantôme.</text>
  </g>
</svg>
