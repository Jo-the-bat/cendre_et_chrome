<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1392 600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d9cfbb" stroke-width="1"/></pattern>
    <pattern id="water" width="26" height="18" patternUnits="userSpaceOnUse"><rect width="26" height="18" fill="#5f9fc0"/><path d="M0 9 q6.5 -6 13 0 t13 0" fill="none" stroke="#9ccadf" stroke-width="2"/><path d="M0 17 q6.5 -6 13 0 t13 0" fill="none" stroke="#9ccadf" stroke-width="1.4" opacity="0.6"/></pattern>
    <pattern id="rust" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#b5651d"/><circle cx="4" cy="5" r="1.8" fill="#8a4a12"/><circle cx="11" cy="11" r="1.6" fill="#d98a3a"/><circle cx="9" cy="3" r="1.3" fill="#d98a3a"/></pattern>
  </defs>
  <rect width="1392" height="600" fill="#f4efe3"/><rect width="1392" height="600" fill="url(#grid)"/>

  <!-- tunnel -->
  <rect x="96" y="144" width="1200" height="408" rx="70" fill="#efe7d6" stroke="#2b2620" stroke-width="8"/>
  <rect x="150" y="252" width="1092" height="252" rx="50" fill="url(#water)"/>
  <!-- rust on walls -->
  <path d="M340 150 q34 16 0 36 q-34 -16 0 -36Z" fill="url(#rust)" opacity="0.7"/><path d="M720 150 q40 18 0 40 q-40 -18 0 -40Z" fill="url(#rust)" opacity="0.7"/>
  <!-- puits / échelle (entrée) -->
  <rect x="160" y="68" width="56" height="76" fill="#cdbf9f" stroke="#2b2620" stroke-width="5"/>
  <line x1="174" y1="68" x2="174" y2="144" stroke="#5b5240" stroke-width="3"/><line x1="202" y1="68" x2="202" y2="144" stroke="#5b5240" stroke-width="3"/><line x1="174" y1="86" x2="202" y2="86" stroke="#5b5240" stroke-width="3"/><line x1="174" y1="106" x2="202" y2="106" stroke="#5b5240" stroke-width="3"/><line x1="174" y1="126" x2="202" y2="126" stroke="#5b5240" stroke-width="3"/>
  <!-- passage (goulot, neutre) -->
  <path d="M1190 264 h106 v144 h-106 Z" fill="#efe7d6" stroke="#2b2620" stroke-width="6"/>
  <!-- grille de trop-plein -->
  <rect x="1040" y="504" width="104" height="48" fill="#efe7d6" stroke="#2b2620" stroke-width="4"/>
  <line x1="1058" y1="504" x2="1058" y2="552" stroke="#7c7160" stroke-width="2"/><line x1="1076" y1="504" x2="1076" y2="552" stroke="#7c7160" stroke-width="2"/><line x1="1094" y1="504" x2="1094" y2="552" stroke="#7c7160" stroke-width="2"/><line x1="1112" y1="504" x2="1112" y2="552" stroke="#7c7160" stroke-width="2"/><line x1="1130" y1="504" x2="1130" y2="552" stroke="#7c7160" stroke-width="2"/>
</svg>
