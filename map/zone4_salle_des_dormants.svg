<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 1140" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d9cfbb" stroke-width="1"/></pattern>
    <pattern id="rust" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#b5651d"/><circle cx="4" cy="5" r="1.8" fill="#8a4a12"/><circle cx="11" cy="11" r="1.6" fill="#d98a3a"/><circle cx="9" cy="3" r="1.3" fill="#d98a3a"/></pattern>
    <linearGradient id="rustfade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b5651d" stop-opacity="0.8"/><stop offset="1" stop-color="#b5651d" stop-opacity="0"/></linearGradient>
    <!-- icône droïde dormant (jeton vu du dessus) -->
    <g id="droid">
      <circle r="17" fill="#d7cdb6" stroke="#4a4234" stroke-width="2.5"/>
      <line x1="0" y1="-17" x2="0" y2="-26" stroke="#4a4234" stroke-width="2.5"/><circle cx="0" cy="-27" r="2.8" fill="#4a4234"/>
      <circle cx="-6" cy="-3" r="3.2" fill="#2b2620"/><circle cx="6" cy="-3" r="3.2" fill="#2b2620"/>
      <rect x="-8.5" y="5" width="17" height="4" rx="2" fill="#2b2620"/>
    </g>
    <style>
      .ttl{font-size:31px;font-weight:700;fill:#241f17}
      .scl{font-size:15px;fill:#241f17}
      .rm{font-size:19px;font-weight:700;fill:#241f17;paint-order:stroke;stroke:#f4efe3;stroke-width:3.5}
      .lbl{font-size:16px;fill:#241f17;paint-order:stroke;stroke:#f4efe3;stroke-width:3.5}
      .sub{font-size:13px;fill:#4a4234;paint-order:stroke;stroke:#f4efe3;stroke-width:3}
      .gl{font-size:15px;font-weight:700;fill:#a11515;paint-order:stroke;stroke:#fff;stroke-width:3}
      .ok{font-size:15px;font-weight:700;fill:#1f6f3a;paint-order:stroke;stroke:#fff;stroke-width:3}
      .leg{font-size:15px;fill:#241f17}
    </style>
  </defs>

  <rect width="1344" height="1140" fill="#f4efe3"/>
  <rect width="1344" height="1140" fill="url(#grid)"/>

  <text x="28" y="44" class="ttl">③ LA SALLE DES DORMANTS — palier 3</text>
  <g transform="translate(1000,28)"><line x1="0" y1="0" x2="48" y2="0" stroke="#241f17" stroke-width="3"/><line x1="0" y1="-6" x2="0" y2="6" stroke="#241f17" stroke-width="3"/><line x1="48" y1="-6" x2="48" y2="6" stroke="#241f17" stroke-width="3"/><text x="58" y="5" class="scl">1 carreau ≈ 1,5 m</text></g>

  <!-- entrée (flèche verte) -->
  <rect x="588" y="68" width="96" height="76" fill="#cdbf9f" stroke="#2b2620" stroke-width="6"/>
  <path d="M636 84 V120 M624 108 L636 122 L648 108" fill="none" stroke="#1f6f3a" stroke-width="5"/>
  <text x="700" y="112" class="ok" style="fill:#1f6f3a">ENTRÉE — depuis la galerie (goulot ②)</text>

  <!-- sol -->
  <rect x="96" y="144" width="1152" height="672" rx="10" fill="#efe7d6" stroke="#2b2620" stroke-width="8"/>

  <!-- avancée de la Rouille (gauche) -->
  <rect x="104" y="152" width="232" height="656" fill="url(#rust)" opacity="0.7"/>
  <rect x="336" y="152" width="200" height="656" fill="url(#rustfade)"/>
  <text x="120" y="470" class="rm" style="fill:#3a1d06;stroke:#f4d9bd">LA ROUILLE</text>
  <text x="120" y="496" class="rm" style="fill:#3a1d06;stroke:#f4d9bd">LES DÉVORE →</text>
  <text x="120" y="522" class="sub" style="fill:#3a1d06;stroke:#f4d9bd">timer : on en sauve moins</text>
  <text x="120" y="540" class="sub" style="fill:#3a1d06;stroke:#f4d9bd">si on traîne</text>

  <!-- droïdes : conscients sauvables (jeton + diode verte) -->
  <g>
    <use href="#droid" transform="translate(610,250)"/><circle cx="622" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(672,250)"/><circle cx="684" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(800,250)"/><circle cx="812" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(862,250)"/><circle cx="874" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(990,250)"/><circle cx="1002" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(1052,250)"/><circle cx="1064" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(1150,250)"/><circle cx="1162" cy="238" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(648,700)"/><circle cx="660" cy="688" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(1086,700)"/><circle cx="1098" cy="688" r="4" fill="#26b050"/>
    <use href="#droid" transform="translate(1150,700)"/><circle cx="1162" cy="688" r="4" fill="#26b050"/>
  </g>
  <!-- droïdes : coques mortes (jeton grisé + croix) -->
  <g opacity="0.55">
    <use href="#droid" transform="translate(920,700)"/><path d="M910 690 L930 710 M930 690 L910 710" stroke="#a11515" stroke-width="3"/>
    <use href="#droid" transform="translate(984,700)"/><path d="M974 690 L994 710 M994 690 L974 710" stroke="#a11515" stroke-width="3"/>
    <use href="#droid" transform="translate(736,250)"/><path d="M726 240 L746 260 M746 240 L726 260" stroke="#a11515" stroke-width="3"/>
  </g>
  <text x="600" y="206" class="sub">berceaux de chargement (← diode verte = conscient à sauver · ✕ = coque morte)</text>

  <!-- les 3 « complexes » -->
  <rect x="616" y="430" width="372" height="180" rx="10" fill="#e9f5ec" stroke="#1f6f3a" stroke-width="3" stroke-dasharray="8 6"/>
  <g>
    <use href="#droid" transform="translate(690,490)"/><circle cx="690" cy="490" r="24" fill="none" stroke="#1f6f3a" stroke-width="3.5"/>
    <use href="#droid" transform="translate(812,490)"/><circle cx="812" cy="490" r="24" fill="none" stroke="#1f6f3a" stroke-width="3.5"/>
    <use href="#droid" transform="translate(750,562)"/><circle cx="750" cy="562" r="24" fill="none" stroke="#1f6f3a" stroke-width="3.5"/>
  </g>
  <text x="690" y="448" text-anchor="middle" class="ok">INIT</text>
  <text x="812" y="448" text-anchor="middle" class="ok">ECHO</text>
  <text x="750" y="600" text-anchor="middle" class="ok">[sans nom]</text>
  <text x="1004" y="500" class="ok">← les 3 « complexes »</text>
  <text x="1004" y="522" class="sub">contremaître · mémoire · enfant</text>

  <!-- porte blindée (sortie vers la chambre) -->
  <g>
    <rect x="588" y="816" width="120" height="38" fill="#9a8f7a" stroke="#2b2620" stroke-width="7"/>
    <line x1="648" y1="816" x2="648" y2="854" stroke="#2b2620" stroke-width="4"/>
    <path d="M600 825 h14 v20 h-14 Z M634 825 h14 v20 h-14 Z M668 825 h14 v20 h-14 Z" fill="#c9a227"/>
  </g>
  <text x="724" y="842" class="gl" style="fill:#7a5a12">▣ PORTE BLINDÉE → CHAMBRE BAKTOID (Larcin/Méca Difficile)</text>

  <!-- ===== LÉGENDE ===== -->
  <rect x="96" y="884" width="1152" height="172" rx="10" fill="#efe7d6" stroke="#2b2620" stroke-width="3"/>
  <text x="116" y="916" class="rm" style="font-size:18px">LÉGENDE</text>
  <g transform="translate(124,946)">
    <use href="#droid" transform="translate(18,8)"/><circle cx="30" cy="-4" r="4" fill="#26b050"/>
    <text x="50" y="14" class="leg">droïde conscient (à sauver)</text>
    <g transform="translate(360,0)" opacity="0.55"><use href="#droid" transform="translate(18,8)"/><path d="M8 -2 L28 18 M28 -2 L8 18" stroke="#a11515" stroke-width="3"/></g>
    <text x="410" y="14" class="leg">coque morte (à laisser)</text>
    <g transform="translate(720,0)"><use href="#droid" transform="translate(18,8)"/><circle cx="18" cy="8" r="24" fill="none" stroke="#1f6f3a" stroke-width="3.5"/></g>
    <text x="772" y="14" class="leg">dormant « complexe » (perso. nommé)</text>
  </g>
  <g transform="translate(124,1006)">
    <rect x="0" y="-6" width="36" height="24" fill="url(#rust)"/>
    <text x="50" y="12" class="leg">zone de Rouille (avance = timer)</text>
    <g transform="translate(360,-6)"><rect x="0" y="0" width="36" height="24" fill="#9a8f7a" stroke="#2b2620" stroke-width="3"/><path d="M4 4 h8 v16 h-8Z M24 4 h8 v16 h-8Z" fill="#c9a227"/></g>
    <text x="410" y="12" class="leg">porte blindée (verrou)</text>
    <path transform="translate(720,0)" d="M18 -4 V14 M6 2 L18 16 L30 2" fill="none" stroke="#1f6f3a" stroke-width="5"/>
    <text x="772" y="12" class="leg">entrée (vert) / sortie</text>
  </g>

  <text x="28" y="1098" class="sub">≈ 24 × 14 carreaux · cœur émotionnel — Lolita parle aux dormants (réveille/calme) · Michel décroche les berceaux · « combien on en sort ? » · Echo est le plus rongé (sauver son cœur-mémoire).</text>
</svg>
